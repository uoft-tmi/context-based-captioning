site_name: Context-Based Captioning
site_description: Whisper rescoring system with shallow fusion
site_author: "Your Team"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Quick Start: QUICKSTART.md
  - Installation: INSTALLATION.md
  - User Guide: USER_GUIDE.md
  - API Reference: API_REFERENCE.md
  - Technical Explanation: TECHNICAL_EXPLANATION.md
  - Parameter Tuning: PARAMETER_TUNING.md
  - Troubleshooting: TROUBLESHOOTING.md
  - FAQ: FAQ.md
  - Meta:
    - Contributing: CONTRIBUTING.md
    - Changelog: CHANGELOG.md
